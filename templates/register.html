<div class="row justify-content-center">
    <div class="col-md-8">
        <div class="card">
            <div class="card-header">
                <h4>Registro de Usuario</h4>
            </div>
            <div class="card-body">
                <form id="register-form">
                    <div class="row">
                        <div class="col-md-6 mb-3">
                            <label for="nombre_completo" class="form-label">Nombre Completo</label>
                            <input type="text" class="form-control" id="nombre_completo" required>
                        </div>
                        <div class="col-md-6 mb-3">
                            <label for="matricula" class="form-label">Matrícula</label>
                            <input type="text" class="form-control" id="matricula" required>
                        </div>
                    </div>

                    <div class="row">
                        <div class="col-md-6 mb-3">
                            <label for="edad" class="form-label">Edad</label>
                            <input type="number" class="form-control" id="edad">
                        </div>
                        <div class="col-md-6 mb-3">
                            <label for="contrasena" class="form-label">Contraseña</label>
                            <input type="password" class="form-control" id="contrasena" required>
                        </div>
                    </div>

                    <div class="row">
                        <div class="col-md-6 mb-3">
                            <label for="facultad" class="form-label">Facultad</label>
                            <select class="form-select" id="facultad" required>
                                <option value="">Seleccione una facultad</option>
                            </select>
                        </div>
                        <div class="col-md-6 mb-3">
                            <label for="carrera" class="form-label">Carrera</label>
                            <select class="form-select" id="carrera" required disabled>
                                <option value="">Seleccione una carrera</option>
                            </select>
                        </div>
                    </div>

                    <div class="row">
                        <div class="col-md-6 mb-3">
                            <label for="genero" class="form-label">Género</label>
                            <select class="form-select" id="genero" required>
                                <option value="">Seleccione un género</option>
                            </select>
                        </div>
                        <div class="col-md-6 mb-3">
                            <label for="imagen" class="form-label">URL de Imagen (opcional)</label>
                            <input type="text" class="form-control" id="imagen">
                        </div>
                    </div>

                    <div class="mb-3">
                        <label class="form-label">Preferencias</label>
                        <div class="row">
                            <div class="col-md-4">
                                <label class="form-label">Deportes</label>
                                <div id="deportes-container" class="form-check-group"></div>
                            </div>
                            <div class="col-md-4">
                                <label class="form-label">Películas</label>
                                <div id="peliculas-container" class="form-check-group"></div>
                            </div>
                            <div class="col-md-4">
                                <label class="form-label">Hobbies</label>
                                <div id="hobbies-container" class="form-check-group"></div>
                            </div>
                        </div>
                        <div class="row mt-2">
                            <div class="col-md-6">
                                <label class="form-label">Colores</label>
                                <div id="colores-container" class="form-check-group"></div>
                            </div>
                            <div class="col-md-6">
                                <label class="form-label">Música</label>
                                <div id="musicas-container" class="form-check-group"></div>
                            </div>
                        </div>
                    </div>

                    <button type="submit" class="btn btn-primary">Registrarse</button>
                </form>
                <div id="register-error" class="alert alert-danger mt-3 d-none"></div>
                <div id="register-success" class="alert alert-success mt-3 d-none">
                    Registro exitoso. <a href="/login">Iniciar sesión</a>
                </div>
            </div>
        </div>
    </div>
</div>

<script src="/static/js/auth.js"></script>
